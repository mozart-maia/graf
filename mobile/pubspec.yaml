name: ar_graffiti
description: "Jogo de Realidade Aumentada e mapas com grafite virtual colaborativo."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Mapas OpenStreetMap
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Geolocalização & Sensores
  geolocator: ^11.0.0
  permission_handler: ^11.3.0

  # Realidade Aumentada (ARCore oficial atualizado para Flutter 3+)
  arcore_flutter_plus: ^1.0.2
  vector_math: ^2.1.4

  # Mídia, Imagens & GIFs
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1

  # Armazenamento Local de Sessão
  shared_preferences: ^2.2.2

  # Networking
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
